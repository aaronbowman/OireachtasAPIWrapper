        to provide for the continued provision of sufficient and effective access
        to cash infrastructure for individuals and SMEs; to provide for access to
        cash criteria; to provide for a framework to manage future changes to access
        to cash infrastructure in a fair, equitable and transparent manner and for
        that purpose to provide for review and amendment of the access to cash criteria
        and for the identification of, and measures to be taken to remedy, local deficiencies
        in access to cash infrastructure and to ensure compliance with the access
        to cash criteria; to provide for the designation of entities on whom certain
        obligations are imposed to remedy local deficiencies and ensure compliance
        with the access to cash criteria; to provide for the monitoring and enforcement
        of obligations imposed on designated entities; to provide for the collection
        and publication of certain information by the Central Bank of Ireland; to
        provide for regulation by the Central Bank of Ireland of ATM deployers and
        cash-in-transit providers and for that purpose to provide for the registration
        of ATM deployers and cash-in-transit providers; to provide for the oversight
        of ATM operators and cash-in-transit providers and enforcement by the Central
        Bank of Ireland of compliance by ATM operators and cash-in-transit providers
        with their obligations under this Act; to provide for the sharing of information
        and cooperation between the Central Bank of Ireland and the Private Security
        Authority; for those and other purposes to amend the Central Bank Act 1942,
        the Central Bank Reform Act 2010, the Central Bank (Supervision and Enforcement)
        Act 2013 and the Companies Act 2014; and to provide for related matters.<\/p>","longTitleGa":"<p>Bille
        d\u00e1 ngairtear&nbsp;Acht do dh\u00e9anamh socr\u00fa chun go leanfar de
        rochtain leordh\u00f3thanach agus \u00e9ifeachtach ar bhonneagar airgid thirim
        a shol\u00e1thar do phearsana aonair agus do FBManna; do dh\u00e9anamh socr\u00fa
        maidir le crit\u00e9ir i nd\u00e1il le rochtain ar airgead tirim; do dh\u00e9anamh
        socr\u00fa maidir le creat chun athruithe sa todhcha\u00ed ar rochtain ar
        bhonneagar airgid thirim a bhainisti\u00fa ar mhodh c\u00f3ir, cothromasach
        agus tr\u00e9dhearcach agus, chun na cr\u00edche sin, do dh\u00e9anamh socr\u00fa
        maidir leis na crit\u00e9ir i nd\u00e1il le rochtain ar airgead tirim a athbhreithni\u00fa
        agus a leas\u00fa agus maidir le heasnaimh \u00e1iti\u00fala i rochtain ar
        bhonneagar airgid thirim a shainaithint agus maidir le bearta a bheidh le
        d\u00e9anamh chun na heasnaimh sin a leigheas, agus a chinnti\u00fa go gcomhl\u00edonfar
        na crit\u00e9ir i nd\u00e1il le rochtain ar airgead tirim; do dh\u00e9anamh
        socr\u00fa maidir le heintitis a shainainmni\u00fa, is eintitis a gcuirfear
        oibleag\u00e1id\u00ed \u00e1irithe orthu maidir le heasnaimh \u00e1iti\u00fala
        a leigheas agus maidir lena chinnti\u00fa go gcomhl\u00edonfar na crit\u00e9ir
        i nd\u00e1il le rochtain ar airgead tirim; do dh\u00e9anamh socr\u00fa maidir
        le faireach\u00e1n a dh\u00e9anamh ar oibleag\u00e1id\u00ed arna bhforchur
        ar eintitis shainainmnithe agus maidir le forfheidhmi\u00fa na n-oibleag\u00e1id\u00ed
        sin; do dh\u00e9anamh socr\u00fa maidir le Banc Ceannais na h\u00c9ireann
        do bhaili\u00fa agus d\u2019fhoilsi\u00fa faisn\u00e9is \u00e1irithe; do dh\u00e9anamh
        socr\u00fa maidir le Banc Ceannais na h\u00c9ireann do rial\u00e1il lucht
        curtha i ngn\u00edomh uathmheais\u00edn\u00ed bainc agus sol\u00e1thraithe
        airgid thirim faoi bhealach agus, chun na cr\u00edche sin, do dh\u00e9anamh
        socr\u00fa maidir le lucht curtha i ngn\u00edomh uathmheais\u00edn\u00ed bainc
        agus sol\u00e1thraithe airgid thirim faoi bhealach a chl\u00e1r\u00fa; do
        dh\u00e9anamh socr\u00fa maidir le formhaoirsi\u00fa ar oibritheoir\u00ed
        uathmheais\u00edn\u00ed bainc agus ar shol\u00e1thraithe airgid thirim faoi
        bhealach agus maidir le Banc Ceannais na h\u00c9ireann d\u2019fhorfheidhmi\u00fa
        chomhl\u00edonadh a n-oibleag\u00e1id\u00ed faoin Acht seo ag oibritheoir\u00ed
        uathmheais\u00edn\u00ed bainc agus ag sol\u00e1thraithe airgid thirim faoi
        bhealach; do dh\u00e9anamh socr\u00fa maidir le comhroinnt faisn\u00e9ise
        agus comhar idir Banc Ceannais na h\u00c9ireann agus an t\u00dadar\u00e1s
        Sl\u00e1nd\u00e1la Pr\u00edobh\u00e1id\u00ed; chun na gcr\u00edoch sin agus
        chun cr\u00edoch eile, do leas\u00fa Acht an Bhainc Cheannais, 1942, an Achta
        um Athch\u00f3iri\u00fa an Bhainc Ceannais, 2010, Acht an Bhainc Ceannais
        (Maoirsi\u00fa agus Forfheidhmi\u00fa), 2013 agus Acht na gCuideachta\u00ed,
        2014; agus do dh\u00e9anamh socr\u00fa i dtaobh nithe gaolmhara.<\/p>\n","shortTitleEn":"Finance
