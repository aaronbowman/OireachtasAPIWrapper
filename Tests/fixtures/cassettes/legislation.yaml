        to provide for the making available of certain supports to survivors of residential
        institutional abuse; to provide for the dissolution of the Residential Institutions
        Statutory Fund Board; to provide for the transfer of certain functions of
        that Board to the Minister for Education and Youth; to amend the Nursing Homes
        Support Scheme Act 2009 and the Mother and Baby Institutions Payment Scheme
        Act 2023; and to provide for related matters.<\/p>","longTitleGa":"<p>Acht
        do dh\u00e9anamh socr\u00fa maidir le taca\u00ed \u00e1irithe a chur ar f\u00e1il
        do mharthan\u00f3ir\u00ed droch\u00fas\u00e1ide i bhforais ch\u00f3naithe;
        do dh\u00e9anamh socr\u00fa maidir le Bord an Chiste Reacht\u00fail Foras
        C\u00f3naithe a dh\u00edscaoileadh; do dh\u00e9anamh socr\u00fa maidir le
        feidhmeanna \u00e1irithe de chuid an Bhoird sin a aistri\u00fa chuig an Aire
        Oideachais agus \u00d3ige; do leas\u00fa an Achta f\u00e1n Sc\u00e9im um Thaca\u00edocht
        Tithe Banaltrais, 2009 agus an Achta um Sc\u00e9im \u00cdoca\u00edochta na
        bhForas M\u00e1ithreacha agus Na\u00edon\u00e1n, 2023; agus do dh\u00e9anamh
